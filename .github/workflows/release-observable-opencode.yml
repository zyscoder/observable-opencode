name: release-observable-opencode

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (optional)"
        required: false
        type: string
  push:
    tags:
      - "observable-v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish observable-opencode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Setup Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          if [ -z "$version" ]; then
            base_version=$(node -p "require('./packages/opencode/package.json').version")
            version="${base_version}-observable.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Publishing observable-opencode $version"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GH_REPO" \
              --target "$SHA" \
              --title "observable-opencode $TAG" \
              --notes "Latest OpenCode baseline with semantic trace instrumentation."
          fi

      - name: Build all supported CLI binaries and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_RELEASE: "1"
        run: bun ./packages/opencode/script/build.ts

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observable-opencode-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            packages/opencode/dist/*.zip
            packages/opencode/dist/*.tar.gz

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GH_REPO" --json tagName,isDraft,publishedAt,assets \
            --jq '{tag: .tagName, draft: .isDraft, published_at: .publishedAt, assets: [.assets[] | {name: .name, size: .size}]}'
