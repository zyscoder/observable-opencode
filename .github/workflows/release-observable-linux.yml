name: release observable

on:
  push:
    tags:
      - "v*-observable.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.14.48-observable.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-observable-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck opencode package
        run: bun run --cwd packages/opencode typecheck

      - name: Typecheck trace renderer package
        run: bun run --cwd packages/trace-renderer typecheck

      - name: Test trace renderer package
        run: bun run --cwd packages/trace-renderer test

      - name: Build CLI binaries
        run: bun run --cwd packages/opencode build --skip-embed-web-ui

      - name: Build trace renderer binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          targets=(
            linux-x64
            linux-x64-baseline
            linux-x64-musl
            linux-x64-baseline-musl
            linux-arm64
            linux-arm64-musl
            darwin-arm64
            darwin-x64
            darwin-x64-baseline
            win32-arm64
            win32-x64
            win32-x64-baseline
          )

          for target in "${targets[@]}"; do
            release_target="${target/win32/windows}"
            extension=""
            if [[ "$target" == win32-* ]]; then
              extension=".exe"
            fi

            asset="release/observable-trace-${release_target}${extension}"
            bun build --compile --target="bun-${target}" packages/trace-renderer/src/cli.ts --outfile "$asset"
            if [ ! -f "$asset" ]; then
              echo "Missing expected renderer binary: $asset" >&2
              exit 1
            fi

            chmod +x "$asset"
          done

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          targets=(
            opencode-linux-x64
            opencode-linux-x64-baseline
            opencode-linux-x64-musl
            opencode-linux-x64-baseline-musl
            opencode-linux-arm64
            opencode-linux-arm64-musl
            opencode-darwin-arm64
            opencode-darwin-x64
            opencode-darwin-x64-baseline
            opencode-windows-arm64
            opencode-windows-x64
            opencode-windows-x64-baseline
          )

          for target in "${targets[@]}"; do
            extension=""
            if [[ "$target" == opencode-windows-* ]]; then
              extension=".exe"
            fi

            source="packages/opencode/dist/${target}/bin/opencode${extension}"
            if [ ! -f "$source" ]; then
              echo "Missing expected binary: $source" >&2
              exit 1
            fi

            asset="release/${target/opencode-/opencode-observable-}${extension}"
            cp "$source" "$asset"
            chmod +x "$asset"

            renderer_asset="release/observable-trace-${target/opencode-/}${extension}"
            if [ ! -f "$renderer_asset" ]; then
              echo "Missing expected renderer binary: $renderer_asset" >&2
              exit 1
            fi
          done

          (cd release && sha256sum opencode-observable-* observable-trace-* > SHA256SUMS)

      - name: Write release notes
        shell: bash
        run: |
          cat > release/RELEASE_NOTES.md <<'EOF'
          Observable opencode binaries and offline trace renderer binaries.

          Every supported platform has a matching pair:

          - opencode-observable-<platform>: records the semantic case trace at runtime
          - observable-trace-<platform>: renders an existing case directory offline

          Recommended asset for most x86_64 enterprise Linux hosts:

          - opencode-observable-linux-x64

          Recommended asset for Apple Silicon macOS hosts:

          - opencode-observable-darwin-arm64

          Other assets:

          - opencode-observable-linux-x64-baseline: x86_64 without AVX2
          - opencode-observable-linux-x64-musl: Alpine/musl x86_64
          - opencode-observable-linux-x64-baseline-musl: Alpine/musl x86_64 without AVX2
          - opencode-observable-linux-arm64: Linux arm64
          - opencode-observable-linux-arm64-musl: Alpine/musl arm64
          - opencode-observable-darwin-x64: macOS Intel
          - opencode-observable-darwin-x64-baseline: macOS Intel without AVX2
          - opencode-observable-windows-arm64.exe: Windows arm64
          - opencode-observable-windows-x64.exe: Windows x64
          - opencode-observable-windows-x64-baseline.exe: Windows x64 without AVX2

          The matching `observable-trace-<platform>` assets use the same platform suffixes;
          Windows renderer assets also use the `.exe` extension.

          Enable trace at runtime with:

          ```bash
          export OPENCODE_CASE_TRACE=1
          export OPENCODE_CASE_ID="T1-001"
          export OPENCODE_CASE_TRACE_DIR="/data/evo-bench/opencode-traces"
          ```

          After a case completes, render it on the matching platform with:

          ```bash
          observable-trace-linux-x64 render /data/evo-bench/opencode-traces/T1-001
          ```
          EOF

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-observable
          path: release/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/opencode-observable-* release/observable-trace-* release/SHA256SUMS --clobber
            gh release edit "$TAG_NAME" --notes-file release/RELEASE_NOTES.md
          else
            gh release create "$TAG_NAME" \
              release/opencode-observable-* \
              release/observable-trace-* \
              release/SHA256SUMS \
              --title "$TAG_NAME" \
              --notes-file release/RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
          fi
