name: release observable

on:
  push:
    tags:
      - "v*-observable.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.14.48-observable.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-observable-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Set stable Observable build identity
        shell: bash
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$TAG_NAME" ]; then
            echo "Expected a release tag beginning with v, got: $TAG_NAME" >&2
            exit 1
          fi

          # Stable OpenCode and Observable OpenCode must share opencode.db.
          # Keep local/preview source builds channel-isolated; only release
          # binaries opt into the stable database identity.
          echo "OPENCODE_CHANNEL=latest" >> "$GITHUB_ENV"
          echo "OPENCODE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Typecheck opencode package
        run: bun run --cwd packages/opencode typecheck

      - name: Build CLI binaries
        run: bun run --cwd packages/opencode build --skip-embed-web-ui

      - name: Verify shared session database path
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/observable-opencode-data
          XDG_CACHE_HOME: ${{ runner.temp }}/observable-opencode-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/observable-opencode-config
          XDG_STATE_HOME: ${{ runner.temp }}/observable-opencode-state
        run: |
          set -euo pipefail
          mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME"
          binary="packages/opencode/dist/opencode-linux-x64/bin/opencode"
          expected="$XDG_DATA_HOME/opencode/opencode.db"
          actual="$("$binary" db path)"

          if [ "$actual" != "$expected" ]; then
            echo "Observable release must use the stable session database" >&2
            echo "expected: $expected" >&2
            echo "actual:   $actual" >&2
            exit 1
          fi

          echo "Shared session database: $actual"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          targets=(
            opencode-linux-x64
            opencode-linux-x64-baseline
            opencode-linux-x64-musl
            opencode-linux-x64-baseline-musl
            opencode-linux-arm64
            opencode-linux-arm64-musl
            opencode-darwin-arm64
            opencode-darwin-x64
            opencode-darwin-x64-baseline
          )

          for target in "${targets[@]}"; do
            source="packages/opencode/dist/${target}/bin/opencode"
            if [ ! -f "$source" ]; then
              echo "Missing expected binary: $source" >&2
              exit 1
            fi

            asset="release/${target/opencode-/opencode-observable-}"
            cp "$source" "$asset"
            chmod +x "$asset"
          done

          (cd release && sha256sum opencode-observable-* > SHA256SUMS)

      - name: Write release notes
        shell: bash
        run: |
          cat > release/RELEASE_NOTES.md <<'EOF'
          Observable opencode binaries with benchmark case trace support.

          Release binaries use the stable OpenCode channel and share the formal OpenCode session database:

          - database path: opencode.db
          - existing sessions can be resumed with `opencode run --session <session-id>`

          Recommended asset for most x86_64 enterprise Linux hosts:

          - opencode-observable-linux-x64

          Recommended asset for Apple Silicon macOS hosts:

          - opencode-observable-darwin-arm64

          Other assets:

          - opencode-observable-linux-x64-baseline: x86_64 without AVX2
          - opencode-observable-linux-x64-musl: Alpine/musl x86_64
          - opencode-observable-linux-x64-baseline-musl: Alpine/musl x86_64 without AVX2
          - opencode-observable-linux-arm64: Linux arm64
          - opencode-observable-linux-arm64-musl: Alpine/musl arm64
          - opencode-observable-darwin-x64: macOS Intel
          - opencode-observable-darwin-x64-baseline: macOS Intel without AVX2

          Enable trace at runtime with:

          ```bash
          export OPENCODE_CASE_TRACE=1
          export OPENCODE_CASE_ID="T1-001"
          export OPENCODE_CASE_TRACE_DIR="/data/evo-bench/opencode-traces"
          ```
          EOF

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-observable
          path: release/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/opencode-observable-* release/SHA256SUMS --clobber
          else
            gh release create "$TAG_NAME" \
              release/opencode-observable-* \
              release/SHA256SUMS \
              --title "$TAG_NAME" \
              --notes-file release/RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
          fi
